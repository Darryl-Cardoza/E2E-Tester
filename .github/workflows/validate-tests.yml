name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static checks and local demo suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run validate

      - name: Playwright test discovery
        run: npm run test:list

      - name: YAML scenario inventory
        run: npm run list:scenarios

      - name: Unit and engine tests
        run: |
          npm run test:unit
          npm run test:engine

      - name: Local demo suites
        run: npm test

      - name: Four-mode verification
        run: npm run test:modes

      - name: Dependency vulnerability report
        # Advisories in transitive packages are reported without blocking unrelated changes.
        continue-on-error: true
        run: |
          {
            echo "### Dependency vulnerability report (non-blocking)"
            echo '```'
            npm audit --audit-level=high 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency license report
        continue-on-error: true
        run: |
          {
            echo "### Dependency licenses (non-blocking)"
            echo '```'
            npm query '*' 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{for(const p of JSON.parse(d||'[]'))console.log(p.name+'@'+p.version+' '+(p.license||'UNKNOWN'))})" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run metadata
        if: always()
        run: |
          {
            echo "### Run metadata"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch or ref: \`$GITHUB_REF_NAME\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Environment: local-demo"
            echo "- APP_BUILD_ID: \`$APP_BUILD_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validate-reports
          path: |
            playwright-report/
            test-results/junit.xml
            test-results/results.json
          retention-days: 14

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validate-failure-artifacts
          path: test-results/e2e/
          retention-days: 7
